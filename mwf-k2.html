const WD = ['일','월','화','수','목','금','토'];
const SHORT = {k1:'공통1', k2:'공통2', mj:'미적Ⅰ', sp:'특강', rv:'특강'};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const mdw = s => { const d = pd(s); return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`; };
const spk = c => c.special === 'cases' ? 'sp' : 'rv';
const today = new Date(); today.setHours(0,0,0,0);

function events(c){
  const ev = {}, add = (d,o) => (ev[d] = ev[d] || []).push(o);
  const sp = DATA.specials[c.special];
  c.special_days.forEach(([d,tm,lab],j) => add(d, {key:spk(c), title:'특강', unit:lab || `${sp.name} ${j+1}차`, tag:tm}));
  c.tracks.forEach(t => t.sessions.forEach(([d,u],i) => {
    let tag = t.key==='k1' ? '1T·2T' : (pd(d).getDay()===6 ? '14:00~17:00' : '1T');
    if (c.extra[d]) tag = c.extra[d];
    add(d, {key:t.key, title:`${t.name} ${i+1}회`, unit:u, tag, teacher:t.teacher});
  }));
  return ev;
}

function classView(c){
  const sp = DATA.specials[c.special], k = spk(c);
  const cards = c.tracks.map(t => `<div class="card ${t.key}"><div class="nm"><b>${t.name}</b><span class="chip">${t.teacher}</span><span>${t.book}</span></div>
    <dt>요일</dt><dd>${t.days}</dd><dt>시간</dt><dd>${t.time}</dd><dt>기간</dt><dd>${t.period}</dd></div>`).join('');
  const cols = ['월','화','수','목','금','토'], w = c.weekly;
  let g = `<div class="wg2"><div></div><div class="wh">1T<small2>16:20~19:10</small2></div><div class="wh">2T<small2>19:10~22:00</small2></div>`;
  const cellH = (v, extra='') => v ? `<div class="wc ${v[0]}${extra}"><b>${v[1]}</b><span>${v[2]}</span></div>` : `<div class="wc e${extra}"></div>`;
  for (let i=0;i<5;i++) g += `<div class="wd">${cols[i]}</div>` + cellH(w['1T'][String(i)]) + cellH(w['2T'][String(i)]);
  if (w.sat){
    g += `<div class="wd sa">토</div>` + w.sat.map(([sl,st,cell]) => cell
      ? `<div class="wc ${cell[0]} sat"><em>${sl} ${st}</em><b>${cell[1]}</b><span>${cell[2]}</span></div>`
      : `<div class="wc e sat"><em>${sl} ${st}</em></div>`).join('');
  } else g += `<div class="wd sa">토</div><div class="wc e"></div><div class="wc e"></div>`;
  g += `</div><div class="wfoot">${c.notes.map(n=>`<span>· ${esc(n)}</span>`).join('')}</div>`;
  const ev = events(c);
  const keys = [k, ...c.tracks.map(t=>t.key)];
  const legend = `<div class="legend">${keys.map(x=>`<span class="${x}"><i></i>${x===k?'특강':c.tracks.find(t=>t.key===x).name}</span>`).join('')}</div>`;
  const spRows = c.special_days.map(([d,tm,lab],j)=>`<div class="sprow ${k}"><b>${mdw(d)}</b><span>${tm}</span><span>${esc(lab || (j+1)+'차')}</span></div>`).join('');
  return `<p class="tlead">담당 <b>${esc(c.teacher_line)}</b></p>
  <section><h2>수업 한눈에 보기</h2><div class="cards">${cards}</div>
    <p class="note">핵심 개념과 필수유형을 공통으로 학습하고, 고난도·복합유형은 학생별 성취도에 따라 추가합니다.</p></section>
  <section><h2>주간 시간표 · 11/9 주부터</h2><div class="box">${g}</div></section>
  <section><h2>11월 1주차 특강</h2><div class="box ${k}"><h3 style="color:var(--c)">${sp.name} <span class="chip">${sp.teacher}</span></h3>
    <div class="note" style="margin:0">${esc(sp.desc)}</div>${spRows}
    <div class="wfoot"><span>· 반별 특강 전체 안내는 위쪽 「11월 1주차 특강」에서 볼 수 있습니다.</span><span>· 11/9(월)부터 정규 수업이 시작됩니다.</span></div></div></section>
  <section><h2>11–12월 달력</h2>${legend}${month(ev,11)}${month(ev,12)}</section>
  <section><h2>12월 일정 안내</h2><div class="dn">${c.dec_notes.map(([kk,a,b])=>`<div class="${kk}"><b>${esc(a)}</b>${esc(b)}</div>`).join('')}</div></section>
  ${list(ev)}`;
}

function month(ev, m){
  const first = new Date(2026,m-1,1), last = new Date(2026,m,0).getDate();
  let h = `<div class="month"><h3>${m}월</h3><div class="cal">${WD.map((x,i)=>`<div class="dw${i==0?' su':i==6?' sa':''}">${x}</div>`).join('')}`;
  for (let i=0;i<first.getDay();i++) h += `<div class="d o"></div>`;
  for (let d=1; d<=last; d++){
    const iso = `2026-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`, wd = new Date(2026,m-1,d).getDay(), es = ev[iso] || [];
    h += `<div class="d${es.length?' has':''}${wd==0?' su':wd==6?' sa':''}"><span class="n">${d}</span>${es.map(e=>`<span class="pill ${e.key}">${SHORT[e.key]}</span>`).join('')}${m==12&&d==25?'<span class="hol">성탄절</span>':''}</div>`;
  }
  return h + `</div></div>`;
}

function list(ev){
  let h = '', cur = 0;
  Object.keys(ev).sort().forEach(d => {
    const dt = pd(d), m = dt.getMonth()+1;
    if (m !== cur){ cur = m; h += `<div class="mhead">${m}월</div>`; }
    ev[d].forEach(e => h += `<div class="row ${e.key}${dt<today?' past':''}"><div class="dt">${m}/${dt.getDate()}<small>${WD[dt.getDay()]}요일</small></div>
      <div><div class="s">${esc(e.title)}<em>${esc(e.tag)}${e.teacher?' · '+esc(e.teacher):''}</em></div><div class="u">${esc(e.unit)}</div></div></div>`);
  });
  return `<section><h2>회차별 학습 계획</h2><div>${h}</div></section>`;
}

function specialView(){
  const S = DATA.specials;
  const cards = ['cases','review'].map(id => { const s = S[id], k = id==='cases'?'sp':'rv';
    const who = DATA.order.filter(x=>DATA.classes[x].special===id).map(x=>DATA.classes[x].name).join(' · ');
    return `<div class="spc ${k}"><div class="nm"><b>${s.name}</b><span class="chip">${s.teacher}</span></div><div class="ds">${esc(s.desc)}</div>
      <div class="who">대상 · ${who}</div><ul>${s.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`; }).join('');
  const per = DATA.order.map(x => { const c = DATA.classes[x], k = spk(c), s = S[c.special];
    return `<div class="cls ${k}"><div class="top"><b>${c.name}</b><span>${s.name} · ${s.teacher}</span></div>
      ${c.special_days.map(([d,tm,lab],j)=>`<div class="sprow ${k}"><b>${mdw(d)}</b><span>${tm}</span><span>${esc(lab||(j+1)+'차')}</span></div>`).join('')}</div>`; }).join('');
  let days = '';
  for (let i=0;i<6;i++){
    const d = new Date(2026,10,2+i), iso = `2026-11-${String(2+i).padStart(2,'0')}`, items = [];
    DATA.order.forEach(x => { const c = DATA.classes[x]; c.special_days.forEach(([dd,tm,lab]) => { if (dd===iso) items.push(`<div class="${spk(c)}"><b>${c.name}</b>${esc(lab || S[c.special].name)} · ${tm}</div>`); }); });
    days += `<div class="day"><div class="dt">11/${2+i}<small>${WD[d.getDay()]}요일</small></div>${items.length?`<div class="it">${items.join('')}</div>`:'<div class="none">수업 없음</div>'}</div>`;
  }
  return `<p class="tlead">11월 2일(월)부터 7일(토)까지, 정규 수업 시작 전 한 주 동안 반별 특강을 진행합니다.</p>
    <section><h2>특강 소개</h2>${cards}</section>
    <section><h2>반별 특강 일정</h2>${per}</section>
    <section><h2>요일별 일정 · 11/2 ~ 11/7</h2>${days}<p class="note">11월 9일(월)부터 반별 윈터 세션1 정규 수업이 시작됩니다.</p></section>`;
}

function route(){
  let k = location.hash.slice(1); if (k==='mwf') k = 'mwf-calc';
  if (!(k in DATA.classes) && k !== 'special') k = DEFAULT_VIEW;
  document.getElementById('app').innerHTML = k==='special' ? specialView() : classView(DATA.classes[k]);
  document.querySelectorAll('.switch button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k===k));
}
document.querySelectorAll('.switch button').forEach(b => b.addEventListener('click', () => {
  if (location.hash !== '#'+b.dataset.k) location.hash = b.dataset.k; else route();
  window.scrollTo({top:0});
}));
window.addEventListener('hashchange', route);
route();
document.getElementById('copy').addEventListener('click', e => {
  const btn = e.currentTarget;
  const sel = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById('tel')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  try { navigator.clipboard.writeText('010.3358.9007').then(() => { btn.textContent='복사됨'; setTimeout(()=>btn.textContent='번호 복사',1500); }, sel); } catch(_) { sel(); }
});
</script>
